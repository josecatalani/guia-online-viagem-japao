<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 214" role="img" aria-label="Cartão Pasmo (rosa)">
  <defs>
    <linearGradient id="pasmoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef6aa6"/>
      <stop offset="1" stop-color="#d23c83"/>
    </linearGradient>
  </defs>
  <rect width="340" height="214" fill="#ffffff"/>
  <rect x="12" y="12" width="316" height="190" rx="20" fill="url(#pasmoBg)"/>

  <!-- wordmark -->
  <text x="32" y="60" font-family="Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="2" fill="#ffffff">PASMO</text>

  <!-- IC chip -->
  <rect x="36" y="96" width="46" height="36" rx="6" fill="#f4c84a" stroke="#caa233" stroke-width="2"/>
  <path d="M36 114 H82 M59 96 V132" stroke="#caa233" stroke-width="2" fill="none"/>

  <!-- contactless waves -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M104 100 a18 18 0 0 1 0 36"/>
    <path d="M116 92 a30 30 0 0 1 0 52"/>
  </g>

  <!-- generic robot mascot (recognition aid) -->
  <g transform="translate(228 90)">
    <rect x="14" y="6" width="6" height="16" rx="3" fill="#ffffff"/>
    <circle cx="17" cy="6" r="6" fill="#ffffff"/>
    <rect x="0" y="20" width="68" height="58" rx="14" fill="#ffffff"/>
    <rect x="12" y="34" width="44" height="22" rx="8" fill="#d23c83"/>
    <circle cx="26" cy="45" r="6" fill="#ffffff"/>
    <circle cx="42" cy="45" r="6" fill="#ffffff"/>
    <rect x="22" y="66" width="24" height="5" rx="2.5" fill="#ef9ac4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-label="Adaptador universal de tomada">
  <rect width="440" height="240" fill="#ffffff"/>

  <!-- output pins on top (what plugs into the wall) -->
  <g fill="#6b7681">
    <rect x="196" y="26" width="13" height="40" rx="3"/>
    <rect x="231" y="26" width="13" height="40" rx="3"/>
  </g>

  <!-- adapter body -->
  <rect x="138" y="64" width="164" height="128" rx="22" fill="#f2f4f6" stroke="#9aa3ad" stroke-width="3"/>
  <!-- front face -->
  <rect x="160" y="86" width="120" height="84" rx="12" fill="#ffffff" stroke="#cdd3da" stroke-width="2"/>

  <!-- universal input holes: round (EU), flat slots (US/JP), angled (AU) -->
  <circle cx="196" cy="112" r="7" fill="#2b3440"/>
  <circle cx="244" cy="112" r="7" fill="#2b3440"/>
  <rect x="192" y="134" width="8" height="24" rx="2" fill="#2b3440"/>
  <rect x="240" y="134" width="8" height="24" rx="2" fill="#2b3440"/>
  <rect x="214" y="132" width="14" height="9" rx="2" fill="#2b3440" transform="rotate(45 221 136)"/>
  <rect x="214" y="151" width="14" height="9" rx="2" fill="#2b3440" transform="rotate(-45 221 155)"/>

  <text x="220" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1f2933">Adaptador universal</text>
</svg>
